services:
  woridge.ms-notification:
        container_name: woridge-ms-notification
        restart: unless-stopped
        build:
            context: .
            dockerfile: Infra/Dockerfile
        environment:
            - ConnectionStrings__DefaultConnection=Server=${DB_HOST},1433;Database=${DB_NAME};User Id=${DB_USER};Password=${MSSQL_PASSWORD};TrustServerCertificate=True
            - "SmtpSettings__Server=${SMTP_SERVER}"
            - "SmtpSettings__Port=${SMTP_PORT}"
            - "SmtpSettings__SenderEmail=${SMTP_SENDER_EMAIL}"
            - "SmtpSettings__Username=${SMTP_USERNAME}"
            - "SmtpSettings__Password=${SMTP_PASSWORD}"
            - "SmtpSettings__UseSsl=${SMTP_USE_SSL}"

        ports:
            - "${NOTIFICATION_PORT}:8080"
        networks:
            - woridge-external-network
        depends_on:
            - woridge.db.notification
            - woridge.mailpit

  woridge.db.notification:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: woridge-db-notif
        restart: unless-stopped
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
        ports:
            - "${MSSQL_PORT}:1433"
        networks:
            - woridge-external-network
        volumes:
            - ms-notification_db:/var/opt/mssql

  woridge.mailpit:
        image: axllent/mailpit:latest
        container_name: mailpit_SMTP
        restart: unless-stopped
        ports:
        #first port for UI and API, second port for SMTP
            - "1025:1025"
            - "8025:8025"
        networks:
            - woridge-external-network
        

networks:
  woridge-external-network:
    external: true
volumes:
    ms-notification_db:
        name: ms-notification_db
